id: dummy_power_smoke
name: Dummy DC 28 V + AC 115 V @ 400 Hz (below HV thresholds)
netlist: netlist/dummy_ita.yaml
required_capabilities:
  - dc_bus
  - ac_bus

steps:
  - id: setup
    name: Cold-start safe
    action: setup

  - id: dc_set
    name: Apply 28 V DC setpoint
    action: dc_apply
    params:
      voltage: 28.0
      current_limit: 5.0
      ovp: 35.0

  - id: dc_on
    name: DC output ON
    action: dc_output
    params:
      enabled: true

  - id: dc_meas
    name: Measure DC within ±0.5 V
    action: dc_measure_expect
    params:
      nominal_v: 28.0
      tol_v: 0.5
      settle_s: 0.2

  - id: dc_off
    name: DC output OFF
    action: dc_output
    params:
      enabled: false

  - id: ac_set
    name: Apply 115 Vrms @ 400 Hz
    action: ac_apply
    params:
      voltage: 115.0
      frequency: 400.0
      current_limit: 5.0

  - id: ac_on
    name: AC output ON
    action: ac_output
    params:
      enabled: true

  - id: ac_meas
    name: Measure AC Vrms/Hz
    action: ac_measure_expect
    params:
      nominal_v: 115.0
      tol_v: 2.0
      nominal_hz: 400.0
      tol_hz: 5.0
      settle_s: 0.3

  - id: ac_off
    name: AC output OFF
    action: ac_output
    params:
      enabled: false

  - id: plugin_dummy
    name: Dummy TPS plugin (capability-only)
    action: plugin
    params:
      module: dummy_tps
      function: run

  - id: teardown
    name: Final reset_safe
    action: teardown
