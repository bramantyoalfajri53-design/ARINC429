# ARINC 718 ATC — T1200 defaults: 031 squawk, 203 pressure altitude
id: atc_xpdr
name: ATC Transponder
funct: ATC
arinc_characteristic: "718"
mode: standard
bus: A
high_speed: false
notes: ATC reply 1234 SQWK @ 150 ms and pressure altitude 0 FT @ 50 ms.
labels:
  - label: "031"
    funct: ATC_REPLY
    direction: both
    sdi: 0
    ssm: NML
    parity: ODD
    rate_ms: 150
    encoding: bcd
    units: SQWK
    bcd_scale: 1.0
    bcd_digits: 4
    eng: { name: squawk, units: SQWK, min: 0, max: 7777, step: 1, default: 1234 }
  - label: "203"
    funct: PRESS_ALT
    direction: both
    sdi: 0
    ssm: NML
    parity: ODD
    rate_ms: 50
    encoding: bnr
    units: FT
    pads: "0"
    bnr: { lsb: 1.0, offset: 0.0, bits: 17 }
    eng: { name: altitude_ft, units: FT, min: -1000, max: 63000, step: 1, default: 0 }
