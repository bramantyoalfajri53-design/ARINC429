[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ate-platform"
version = "0.1.0"
description = "ATE station kernel: device access, sequencer, results, ITA netlist"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pyvisa>=1.13",
  "pyyaml>=6.0",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "itsdangerous>=2.1",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
ate-station = "ate_platform.cli.station:main"
ate-run = "ate_platform.cli.run:main"
ate-web = "ate_platform.web.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "plugins"]
testpaths = ["tests"]
