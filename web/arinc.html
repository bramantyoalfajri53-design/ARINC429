<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ATE 429 Console</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/arinc.css?v=29" />
</head>
<body>
  <div id="login-view" class="screen screen-login">
    <div class="login-card">
      <h1 class="brand">ATE <span>429</span></h1>
      <p class="muted">ARINC 429 test console. Lab PIN required.</p>
      <form id="login-form" class="login-form">
        <input type="password" id="pin" placeholder="PIN" autocomplete="current-password" required />
        <button type="submit">Enter</button>
      </form>
      <p id="login-error" class="err" hidden></p>
    </div>
  </div>

  <div id="app-view" class="app" hidden>
    <header class="topbar">
      <div class="topbar-brand">ATE <span>429</span></div>
      <nav id="breadcrumb" class="breadcrumb"></nav>
      <div class="topbar-status" id="topbar-status">
        <span id="run-pill" class="pill pill-stop">STOPPED</span>
        <span id="rate-pill" class="pill">12.5 kbps</span>
        <button type="button" id="btn-arinc-start" class="btn btn-sm">Start</button>
        <button type="button" id="btn-arinc-stop" class="btn btn-sm btn-ghost" disabled>Stop</button>
      </div>
      <div class="topbar-actions">
        <a href="/" class="link-muted">Operator</a>
        <button type="button" id="btn-logout" class="btn btn-ghost">Logout</button>
      </div>
    </header>

    <main id="view-root" class="content"></main>
  </div>

  <div id="modal-root" hidden></div>

  <!-- DYNAPRO CRT / DYNAMIC STANDARD MODE MODAL OVERLAY -->
  <div id="dynapro-modal" style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; background:#040d07; z-index:99999; overflow-y:auto; padding:16px; box-sizing:border-box;">
    <div style="max-width:1200px; margin:0 auto; display:flex; flex-direction:column; height:100%;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; border-bottom:1px solid #143522; padding-bottom:8px;">
        <span style="color:#10b981; font-family:'JetBrains Mono', monospace; font-weight:bold; font-size:14px; letter-spacing:1px;">
          DYNAPRO 1780A INFOTOUCH &bull; ARINC 429 DYNAMIC STANDARD MODE
        </span>
        <button type="button" id="btn-close-dynapro" style="background:#064e3b; border:1px solid #34d399; color:#a7f3d0; font-weight:bold; padding:6px 14px; border-radius:4px; cursor:pointer; font-family:'JetBrains Mono', monospace;">
          &larr; EXIT DYNAPRO
        </button>
      </div>
      <iframe id="dynapro-frame" src="/dist/index.html" style="flex:1; width:100%; min-height:650px; border:1px solid #059669; border-radius:8px; background:#06120b;"></iframe>
    </div>
  </div>

  <script src="/static/arinc.js?v=29"></script>
</body>
</html>
