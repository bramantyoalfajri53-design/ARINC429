#
# Astronics AES
# Card number configuration file
#
# RPC DEVICES:
#
#   Add lines below to map a card number to a particular
#   BTIDriver RPC device.  Either a MAC address or an IP
#   address can be specified.  Use an IP address only if
#   a static IP address has been assigned to the device.
#
#   The format should be:
#     <CARDNUM>,<MAC_ADDRESS>
#     <CARDNUM>,<IP_ADDRESS>
#
#   Example:
#     0,00:50:C2:2E:20:00   #RPC device at card #0
#     1,192.168.0.99        #RPC device at card #1
#
#
# PCI CARDS:
#
#   The starting card number for all PCI cards can be set.
#   If none is specified, then all PCI cards are in system
#   order starting at zero.
#   
#   Note that if an RPC device is assigned the same card number
#   as a PCI device, the RPC device takes precedence.
#
#   The format should be:
#     <CARDNUM>,pcistart
#
#   Example:
#     10,pcistart            #PCI cards start at card #10
#
#
# USB CARDS:
#
#   The starting card number for all USB cards can be set.
#   If none is specified, then all USB cards are in system
#   order starting after the last PCI card, or zero if there
#   are no PCI cards.
#
#   Note that if an RPC device is assigned the same card number
#   as a USB device, the RPC device takes precedence.
#
#   Likewise, if a PCI card is assigned the same card number
#   as a USB device, the PCI device takes precedence.
#
#   The format should be:
#     <CARDNUM>,usbstart
#
#   Example:
#     20,usbstart            #USB cards start at card #20
#
#
